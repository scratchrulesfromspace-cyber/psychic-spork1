name: Create torrent
on:
  push:
    branches:
      - master
      
env:
  name: "Game Android Base"
  comment: "Oct 14 26"
  url: "https://blehpooffileditchstuff.org/MTc5MjA2MTM2OTpzUDFwV3dvLVZRZFVKY0ZZLWJtV2RiU1hqNDJkN3hlaFQyRVhGWFdHY0g4OjcwMTgvYmV0YTMzLzZmNGFkNjY2ZmE3NWI1ZTZkYjA4L0dUQTVBbmRyb2lkQmFzZS43eg"
  file_name: "GAMEAndroidBase.7z"
  piece_size: 24 # Check the README.md for recommended piece size
      
jobs:
  create:
    runs-on: ubuntu-20.04
    steps:
      - name: Install mktorrent
        run: sudo apt-get install mktorrent
        
      - name: Download file
        run: wget -nv -O "$file_name" "$url"
        
      - name: Create torrent using mktorrent
        run: mktorrent -c "$comment" -l $piece_size -o "${name}.torrent" -w "$url" "$file_name"
        
      - name: Upload torrent file
        uses: actions/upload-artifact@v2
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}.torrent
